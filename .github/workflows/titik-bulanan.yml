name: Data lampu isyarat & kamera (bulanan)

# Sebulan sekali ambil lampu isyarat & kamera laju Malaysia dari OpenStreetMap (Overpass) dan simpan dalam
# docs/data/titik.json. GitHub Pages menghidangnya; aplikasi membacanya dahulu (Overpass dari telefon = sandaran).
# Hanya fail data itu yang diubah (bukan kod aplikasi). Push oleh GITHUB_TOKEN tidak mencetuskan deploy.
on:
  schedule:
    - cron: '17 3 2 * *'      # hari ke-2 setiap bulan, 03:17 UTC
  workflow_dispatch:
    inputs:
      ujian_gagal:
        description: 'Ujian amaran: sengaja gagalkan tugas untuk semak isu dibuka (biarkan kosong biasanya)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write            # buka isu bila tugas gagal

concurrency:
  group: titik-bulanan
  cancel-in-progress: false

jobs:
  ambil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Gagalkan (ujian amaran sahaja)
        if: ${{ github.event.inputs.ujian_gagal == 'true' }}
        run: exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Ambil data dari Overpass
        run: node scripts/ambil-titik.js
      - name: Simpan jika berubah
        run: |
          git add -N docs/data/titik.json
          if git diff --quiet -- docs/data/titik.json; then
            echo "Tiada perubahan."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/titik.json
          git commit -m "Data bulanan: lampu isyarat & kamera laju Malaysia"
          git push origin HEAD:main
      - name: Buka isu jika gagal
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Tugas bulanan gagal: lampu isyarat & kamera laju" \
            --body "Tugas bulanan **lampu isyarat & kamera laju** gagal. Data lama kekal dan app masih berfungsi, tetapi data tidak dikemas kini bulan ini. Log: $RUN_URL . Buka halaman log, tekan Run workflow untuk cuba semula, atau beritahu Claude."
