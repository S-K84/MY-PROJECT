name: Data OSM bulanan (had laju, tempat, lampu isyarat & kamera)

# Sebulan sekali ambil jalan ber-had laju (docs/data/had/), tempat: minyak, R&R, masjid, tandas, makan, ATM, caj EV, stesen (docs/data/poi/)
# dan lampu isyarat & kamera laju (docs/data/titik.json)
# Malaysia dari fail OpenStreetMap penuh (Geofabrik); kawasan 0.25°.
# GitHub Pages menghidangnya; aplikasi memuat hanya kawasan di sekitar laluan (Overpass dari telefon = sandaran).
# Overpass tidak digunakan di sini: terlalu sibuk (13 Nov 2026: ~14 jam untuk seluruh negara). Fail penuh siap dalam beberapa minit.
# Hanya fail data yang diubah (bukan kod aplikasi). Push oleh GITHUB_TOKEN tidak mencetuskan deploy.
on:
  schedule:
    - cron: '41 3 3 * *'      # hari ke-3 setiap bulan, 03:41 UTC
  workflow_dispatch:
    inputs:
      ujian_gagal:
        description: 'Ujian amaran: sengaja gagalkan tugas untuk semak isu dibuka (biarkan kosong biasanya)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write            # buka isu bila tugas gagal

concurrency:
  group: had-bulanan
  cancel-in-progress: false

jobs:
  ambil:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Gagalkan (ujian amaran sahaja)
        if: ${{ github.event.inputs.ujian_gagal == 'true' }}
        run: exit 1
      - name: Muat turun fail Malaysia (Geofabrik)
        run: curl -fsSL --retry 5 --retry-delay 20 -o "$RUNNER_TEMP/malaysia.osm.pbf" https://download.geofabrik.de/asia/malaysia-singapore-brunei-latest.osm.pbf && ls -l "$RUNNER_TEMP/malaysia.osm.pbf"
      - name: Pasang pembaca OSM (pyosmium)
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet osmium
      - name: Hasilkan kawasan had laju
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/ambil_had.py "$RUNNER_TEMP/malaysia.osm.pbf"
      - name: Hasilkan tempat (minyak, R&R, masjid, ...)
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/ambil_poi.py "$RUNNER_TEMP/malaysia.osm.pbf"
      - name: Hasilkan lampu isyarat & kamera laju
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/ambil_titik.py "$RUNNER_TEMP/malaysia.osm.pbf"
      - name: Simpan jika berubah
        run: |
          git add -A docs/data/had docs/data/poi docs/data/titik.json
          if git diff --cached --quiet; then
            echo "Tiada perubahan."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data bulanan: had laju, tempat, lampu isyarat & kamera Malaysia"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Buka isu jika gagal
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Tugas bulanan gagal: data OSM (had laju, tempat, lampu isyarat & kamera)" \
            --body "Tugas bulanan **data OSM (had laju, tempat, lampu isyarat & kamera)** gagal. Data lama kekal dan app masih berfungsi, tetapi data tidak dikemas kini bulan ini. Log: $RUN_URL . Buka halaman log, tekan Run workflow untuk cuba semula, atau beritahu Claude."
