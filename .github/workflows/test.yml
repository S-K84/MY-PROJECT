name: Ujian

on:
  pull_request:
  workflow_dispatch:
  workflow_call:          # dipanggil oleh deploy.yml sebelum deploy

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Jalankan ujian
        run: npm test

  # Buka aplikasi dalam Chromium sebenar (Leaflet dari npm, servis Apps Script olok-olok) — tangkap ralat skrin,
  # navigasi, laporan & carian sebelum merge. Tidak menggantikan ujian iPhone melalui saluran uji (?uji=1).
  browser:
    # Disemat: 'ubuntu-latest' bertukar ke Ubuntu baharu (resolute) pada 11 Nov 2026 dan 'playwright install --with-deps' gagal
    # (apt tidak dapat mencapai pelayan Ubuntu). Naikkan semula bila Playwright disahkan berfungsi di versi baharu.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Pasang pakej ujian
        run: npm ci
      - name: Pasang Chromium
        run: npx playwright install --with-deps chromium
      - name: Jalankan ujian pelayar
        run: npm run test:browser
