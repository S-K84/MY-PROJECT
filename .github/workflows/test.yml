name: Ujian

on:
  pull_request:
  workflow_dispatch:
  workflow_call:          # dipanggil oleh deploy.yml sebelum deploy

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Jalankan ujian
        run: npm test

  # Buka aplikasi dalam Chromium sebenar (Leaflet dari npm, servis Apps Script olok-olok) — tangkap ralat skrin,
  # navigasi, laporan & carian sebelum merge. Tidak menggantikan ujian iPhone melalui saluran uji (?uji=1).
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Pasang pakej ujian
        run: npm ci
      - name: Pasang Chromium
        # 11 Nov 2026: apt tidak dapat mencapai pelayan Ubuntu (DNS) pada pelari GitHub, jadi '--with-deps' gagal walaupun
        # kod tidak berubah. Jika apt gagal, pasang pelayar sahaja (pustaka sistem sudah ada pada imej pelari).
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Jalankan ujian pelayar
        run: npm run test:browser
