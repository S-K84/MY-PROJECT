name: Ujian

on:
  pull_request:
  workflow_dispatch:
  workflow_call:          # dipanggil oleh deploy.yml sebelum deploy

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Jalankan ujian
        run: npm test
