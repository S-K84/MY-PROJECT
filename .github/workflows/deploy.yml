name: Deploy ke Apps Script

# Bila kod masuk ke main (cth. PR di-merge): jalankan ujian, kemudian hantar kod ke Apps Script
# dan kemas kini deployment SEDIA ADA (pautan /exec kekal sama). Persediaan: docs/DEPLOY.md
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Secret disimpan dalam environment "apps-script" yang dihadkan kepada cawangan main (lihat docs/DEPLOY.md)
    environment: apps-script
    env:
      CLASP: npx --yes @google/clasp@2.4.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Semak secret
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::warning::Secret deploy belum ditetapkan (CLASPRC_JSON, SCRIPT_ID, DEPLOYMENT_ID). Lihat docs/DEPLOY.md. Deploy dilangkau."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$SCRIPT_ID" | grep -Eq '^[A-Za-z0-9_-]{20,}$' || ! printf '%s' "$DEPLOYMENT_ID" | grep -Eq '^[A-Za-z0-9_-]{20,}$'; then
            echo "::error::SCRIPT_ID atau DEPLOYMENT_ID tidak sah. Salin semula seperti dalam docs/DEPLOY.md."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Sediakan kelayakan clasp
        if: steps.check.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json

      - name: Hantar kod ke Apps Script
        if: steps.check.outputs.ready == 'true'
        # .claspignore: hanya Code.gs, Index.html dan appsscript.json dihantar
        run: $CLASP push --force

      - name: Kemas kini deployment sedia ada (versi baharu)
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: $CLASP deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: Padam kelayakan
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
